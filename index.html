<body>
<header><div><h1>🌱 Il Mio Orto</h1><div>V8.1 · Confezioni, semi e calendario</div></div><div class="header-actions"><button type="button" id="campanella" class="secondary no-print" onclick="page='promemoria';render()" aria-label="Apri promemoria intelligenti">🔔 <span id="numeroPromemoria">0</span></button><button type="button" id="toggleTestModeButton" class="secondary no-print" onclick="toggleTestMode()">🧪 Modalità TEST</button><button class="secondary" onclick="backup()">💾 Backup</button></div></header>
<div class="wrap">
<nav id="nav"></nav>

<script>
const LIVE_KEY="ortoGestionale_v1";
const TEST_KEY="ortoGestionale_v1_TEST_ISOLATO";
const TEST_MODE_KEY="ortoGestionale_v1_TEST_ATTIVO";
// Ripristina la modalità TEST dopo il ricaricamento, solo se l'archivio TEST esiste.
let testMode=localStorage.getItem(TEST_MODE_KEY)==='1' && localStorage.getItem(TEST_KEY)!==null;
let KEY=testMode?TEST_KEY:LIVE_KEY;
function toggleTestMode(){
 if(cloudBusy){alert("Operazione cloud in corso. Attendi il completamento prima di cambiare modalità.");return;}
 if(!testMode){
  const existing=localStorage.getItem(TEST_KEY);
  if(existing!==null){
   if(!confirm('Rientrare in MODALITÀ TEST usando i dati di prova già salvati? I dati reali e il cloud non verranno modificati.'))return;
  }else{
   if(!confirm('Attivare MODALITÀ TEST? Verrà creata una copia separata dei dati reali. Il cloud resterà bloccato.'))return;
  }
  clearTimeout(cloudTimer);
  if(existing===null)localStorage.setItem(TEST_KEY,JSON.stringify(db));
  KEY=TEST_KEY;testMode=true;
  localStorage.setItem(TEST_MODE_KEY,'1');
  db=JSON.parse(localStorage.getItem(TEST_KEY));
 }else{
  if(!confirm('Uscire dalla modalità TEST? I dati di prova resteranno salvati e separati. Nessun dato di prova verrà trasferito al cloud.'))return;
  clearTimeout(cloudTimer);
  KEY=LIVE_KEY;testMode=false;
  localStorage.removeItem(TEST_MODE_KEY);
  db=JSON.parse(localStorage.getItem(LIVE_KEY)||'{"colture":[],"attivita":[],"raccolti":[],"trattamenti":[]}');
 }
 if(!testMode){cloudVersion=null;cloudDirty=false;localStorage.removeItem(CLOUD_VERSION_STORAGE);}
  cloudMessage(testMode?'MODALITÀ TEST: sincronizzazione cloud disattivata.':'Modalità normale ripristinata. Scarica o verifica i dati cloud prima di modificare.');
 render();
}
function testModeBanner(){
 const old=document.getElementById('testModeBanner');if(old)old.remove();
 const banner=document.createElement('div');banner.id='testModeBanner';banner.className='no-print';
 banner.style.cssText='padding:10px 18px;text-align:center;font-weight:750;background:'+(testMode?'#fff0c2':'#e9f3ed')+';color:#254b37';
 banner.textContent=testMode?'⚠️ MODALITÀ TEST ATTIVA — DATI SEPARATI, CLOUD BLOCCATO':'Modalità normale — dati reali';
 document.querySelector('header').after(banner);
 const btn=document.getElementById('toggleTestModeButton');if(btn){btn.textContent=testMode?'🧪 Esci da TEST':'🧪 Modalità TEST';btn.style.background=testMode?'#a96513':'';}
}

let db=JSON.parse(localStorage.getItem(KEY)||'{"colture":[],"attivita":[],"raccolti":[],"trattamenti":[]}');
db.trattamenti=db.trattamenti||[];db.trattamenti ||= []; db.mappa ||= []; db.irrigazioni ||= []; db.concimazioni ||= []; db.foto ||= []; db.alberi ||= []; db.prodotti ||= []; db.movimentiMagazzino ||= []; db.fotoSchede ||= []; db.pianiIrrigazione ||= []; db.pioggeMisurate ||= []; db.semine ||= []; db.rotazioni ||= []; db.spese ||= []; db.prezziRaccolti ||= []; db.eventiFrutteto ||= []; db.lavoriAnnuali ||= []; db.trappole ||= []; db.controlliTrappole ||= []; db.sementi ||= []; db.movimentiSementi ||= []; db.proveGerminazione ||= []; db.pianiSemina ||= []; db.totaliRaccoltiManuali ||= []; db.promemoriaCompletati ||= {}; db.impostazioniMeteo ||= {localita:'Forlì',lat:44.2226,lon:12.0408,gelata:2,caldo:32,pioggia:10}; let page="dashboard"; window.ripetizione=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));cloudChanged();render()}
const GROUPS=[
 {id:"dashboard",label:"🏠 Dashboard",items:[["dashboard","Panoramica"]]},
 {id:"piante",label:"🌱 Piante",items:[["colture","🌿 Colture"],["alberi","🌳 Alberi da frutto"],["frutteto","🍎 Diario del frutteto"],["schede","📷 Schede e foto"],["dettaglio","📒 Scheda pianta"],["mappa","🗺️ Mappa orto"]]},
 {id:"interventi",label:"🧴 Interventi",items:[["irrigazioni","💧 Irrigazioni"],["concimazioni","🌾 Concimazioni"],["trattamenti","🧴 Trattamenti"],["trappole","🪤 Trappole insetti"],["prodotti","📦 Prodotti e magazzino"],["attivita","📋 Attività"]]},
 {id:"pianificazione",label:"📅 Pianificazione",items:[["semine","🌱 Semine e trapianti"],["sementi","🌰 Magazzino sementi"],["rotazioni","🔄 Rotazioni"],["calendario","🗓️ Calendario"],["calendarioSemine","🌱 Calendario semine"],["annuale","📆 Piano annuale"],["promemoria","🔔 Scadenze"]]},
 {id:"cloud",label:"☁️ Sincronizzazione",items:[["cloud","☁️ Mac e Linux"]]},
  {id:"strumenti",label:"📊 Strumenti",items:[["raccolti","🍅 Raccolti"],["economia","💶 Costi e produttività"],["statistiche","📊 Statistiche"],["bilancio","📑 Bilancio annuale"],["confronto","📈 Confronti raccolti"],["meteo","🌦️ Meteo"],["ricerca","🔎 Ricerca"],["controllo","🛡️ Controllo dati"],["stampa","🖨️ Stampa"],["dati","💾 Backup"]]}
];
function goGroup(id){let g=GROUPS.find(x=>x.id===id);if(g){page=g.items[0][0];render()}}

 const group=document.getElementById('menu-group-'+id);

}

function nav(){
 let active=GROUPS.find(g=>g.items.some(item=>item[0]===page))||GROUPS[0];
 document.getElementById("nav").innerHTML=`<div class="side-brand">🌿 <strong>Il Mio Orto</strong><small>GESTIONALE V8.1</small></div>${GROUPS.map(g=>`<div class="side-group" id="menu-group-${g.id}"><button type="button" class="side-label side-group-button" onclick="toggleMenuGroup('${g.id}')" aria-expanded="true" title="Mostra o nascondi le opzioni di ${g.label}">${g.label} <span class="group-arrow" aria-hidden="true">▾</span></button>${g.items.map(item=>`<button type="button" class="side-link ${page===item[0]?'selected':''}" aria-current="${page===item[0]?'page':'false'}" onclick="page='${item[0]}';render()">${item[1]}</button>`).join('')}</div>`).join('')}`;
}
function render(){testModeBanner();aggiornaCampanella();if(page==="cloud"){nav();cloudPage(document.getElementById("app"));return}if(window.ripetizione && page!==window.ripetizione.tipo)window.ripetizione=null;nav();let a=document.getElementById("app"); if(page=="dashboard")dash(a); if(page=="colture")colture(a); if(page=="attivita")attivita(a); if(page=="raccolti")raccolti(a); if(page=="trattamenti")trattamenti(a);if(page=="trappole")trappole(a); if(page=="mappa")mappa(a); if(page=="dati")dati(a); if(page=="irrigazioni")irrigazioni(a);if(page=="concimazioni")concimazioni(a);if(page=="schede")schede(a);if(page=="dettaglio")dettaglioPianta(a);if(page=="calendario")calendario(a);if(page=="calendarioSemine")calendarioSemine(a);if(page=="semine")semine(a);if(page=="sementi")sementi(a);if(page=="rotazioni")rotazioni(a);if(page=="statistiche")statistiche(a);if(page=="annuale")pianoAnnuale(a);if(page=="bilancio")bilancioAnnuale(a);if(page=="economia")economia(a);if(page=="confronto")confronto(a);if(page=="alberi")alberi(a);if(page=="frutteto")frutteto(a);if(page=="meteo")meteo(a);if(page=="ricerca")ricerca(a);if(page=="controllo")controlloDati(a);if(page=="promemoria")promemoria(a);if(page=="prodotti")prodotti(a);if(page=="stampa")stampa(a);aggiornaIntestazioneStampa();aggiungiPulsanteStampa()}

const PRINT_SECTIONS=[['annuale','Piano annuale'],['bilancio','Bilancio annuale'],['controllo','Controllo dati'],['frutteto','Diario del frutteto'],['semine','Semine e trapianti'],['sementi','Magazzino sementi'],['rotazioni','Rotazioni colturali'],['economia','Costi e produttività'],['mappa','Mappa orto'],['schede','Schede e foto'],['colture','Colture'],['alberi','Alberi da frutto'],['irrigazioni','Irrigazioni'],['concimazioni','Concimazioni'],['trattamenti','Trattamenti'],['trappole','Trappole insetti'],['raccolti','Raccolti'],['attivita','Attività'],['prodotti','Prodotti e magazzino'],['statistiche','Statistiche'],['confronto','Confronti raccolti'],['calendario','Calendario'],['calendarioSemine','Calendario intelligente semine'],['promemoria','Scadenze']];
function aggiornaIntestazioneStampa(){
 let label=PRINT_SECTIONS.find(x=>x[0]===page)?.[1]||'Report';

const coloriGrafico=['#227a41','#cf6a21','#2459b5','#a43e92','#8a7121','#12838d','#9b423b','#5a50a2'];
function graficoMensileSVG(anni,records){
 const left=58,right=890,top=28,bottom=293,w=right-left,h=bottom-top;
 const valid=anni.filter(y=>records.some(r=>Number(r.data.slice(0,4))===y));
 const values=y=>Array.from({length:12},(_,i)=>records.filter(r=>Number(r.data.slice(0,4))===y&&Number(r.data.slice(5,7))===i+1).reduce((s,r)=>s+Number(r.q),0));
 const max=Math.max(1,...valid.flatMap(y=>values(y)));
 const ceiling=Math.ceil(max/5)*5||5;
 const x=i=>left+(w*i/11),yy=v=>bottom-h*v/ceiling;
 let out='';
 for(let i=0;i<=5;i++){let v=ceiling*i/5,y=yy(v);out+=`<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#e0e8df"/><text x="${left-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#526452">${v.toFixed(v%1?1:0)}</text>`}
 ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'].forEach((m,i)=>out+=`<text x="${x(i)}" y="${bottom+24}" text-anchor="middle" font-size="12" fill="#526452">${m}</text>`);
 out+=`<text x="12" y="18" font-size="12" fill="#526452">kg</text>`;
 valid.forEach(y=>{let vs=values(y),color=coloriGrafico[anni.indexOf(y)%coloriGrafico.length];out+=`<polyline points="${vs.map((v,i)=>`${x(i)},${yy(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;vs.forEach((v,i)=>{out+=`<circle cx="${x(i)}" cy="${yy(v)}" r="4" fill="${color}"><title>${y} - ${i+1}: ${v.toFixed(3)} kg</title></circle>`})});
 return out;
}

async function aggiungiFotoScheda(){
 const input=document.getElementById('sdFoto'),f=input?.files?.[0];
 if(!f)return alert('Scegli una foto');
 if(!f.type.startsWith('image/'))return alert('Seleziona un file immagine valido.');
 if(f.size>15*1024*1024)return alert('Foto troppo grande (max 15 MB). Riducila prima di caricarla.');
 const plantId=schedaCorrente;
 if(!piantaById(plantId))return alert('Pianta non trovata.');
 try{
  const url=URL.createObjectURL(f);
  let img;
  try{img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(new Error('Formato immagine non leggibile'));el.src=url})}
  finally{URL.revokeObjectURL(url)}
  const scale=Math.min(1,1200/img.naturalWidth,1200/img.naturalHeight);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
  canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  const src=canvas.toDataURL('image/jpeg',0.72);
  const record={plantId,src,data:localDay(new Date())};
  db.fotoSchede.push(record);
  try{
   localStorage.setItem(KEY,JSON.stringify(db));
  }catch(e){
   db.fotoSchede.pop();
   return alert('Foto NON salvata: spazio del browser insufficiente. I dati precedenti non sono stati modificati. Esporta un backup JSON.');
  }
  cloudChanged();render();
  alert('Fotografia salvata. Verifica che rimanga presente dopo aver aggiornato la pagina.');
 }catch(e){alert('Foto NON salvata: '+(e?.message||'errore sconosciuto'))}
}

function correggiMovimento(i){

 if(!p)return alert('Impossibile correggere: il prodotto originale non è identificabile con certezza. Usa ± Scorta per una rettifica manuale.');
 const input=prompt('Nuova variazione in '+p.unita+' (es. 50 o -10)',String(m.quantita));if(input===null)return;
 const n=Number(input.trim().replace(',','.'));
 if(!input.trim()||!Number.isFinite(n)||n===0)return alert('Quantità non valida');
 const old=Number(m.quantita),difference=n-old;
 if(!Number.isFinite(old))return alert('Movimento non valido');
 if(Number(p.giacenza||0)+difference<0&&!confirm('La giacenza diventerà negativa. Continuare?'))return;
 if(!confirm('Correggere il movimento da '+old+' a '+n+' '+p.unita+'? La giacenza cambierà di '+difference+' '+p.unita+'.'))return;
 p.giacenza=Math.round((Number(p.giacenza||0)+difference)*10000)/10000;

 const q=Number(m.quantita);
 if(!Number.isFinite(q))return alert('Movimento non valido');
 const next=Number(p.giacenza||0)-q;
 if(next<0&&!confirm('Annullando il movimento, la giacenza diventerà negativa. Continuare?'))return;

if(!Number.isFinite(used)||used<=0)return;

async function importaCatalogo(){
 const f=document.getElementById('catalogFile').files[0];if(!f)return alert('Scegli un file JSON');
 try{
  const raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.prodotti;
  if(!Array.isArray(arr)||arr.length>1000)throw Error('Il JSON deve contenere un elenco prodotti (massimo 1000)');
  const valid=arr.filter(x=>x&&typeof x.nome==='string'&&x.nome.trim()&&['concimi','trattamenti','trappole','attrattivi'].includes(x.tipo));
  if(!valid.length)throw Error('Nessuna scheda valida');
  window.catalogoDaImportare=valid;
  const norm=x=>String(x||'').toLocaleLowerCase('it').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  document.getElementById('catalogPreview').innerHTML='<h3>Controlla prima di importare</h3>'+valid.map((x,i)=>{
   const matches=db.prodotti.map((p,j)=>({p,j})).filter(o=>o.p.tipo===x.tipo&&(norm(o.p.nome)===norm(x.nome)||norm(o.p.nome).includes(norm(x.nome))||norm(x.nome).includes(norm(o.p.nome))));
   return `<div class="card" style="margin:10px 0"><b>${esc(x.nome)}</b> · ${esc(x.tipo)}<p class="muted">${esc(x.composizione||'Composizione non indicata')} · ${esc(x.fonte||'Fonte non indicata')}</p><label>Operazione<select id="catalogAction${i}"><option value="skip">Non importare (sicuro)</option><option value="new">Aggiungi nuova scheda</option>${matches.map(o=>`<option value="update:${o.j}">Aggiorna solo dati tecnici di ${esc(o.p.nome)} (giacenza invariata)</option>`).join('')}</select></label>${matches.length?'<p class="muted">Possibile prodotto già presente: controlla prima di aggiungerne un altro.</p>':''}</div>`;
  }).join('')+'<button onclick="confermaImportaCatalogo()">Conferma operazioni selezionate</button>';
 }catch(e){alert('Impossibile leggere JSON: '+e.message)}
}
function confermaImportaCatalogo(){
 const arr=window.catalogoDaImportare;if(!Array.isArray(arr))return;
 const actions=arr.map((x,i)=>document.getElementById('catalogAction'+i)?.value||'skip');
 if(!actions.some(a=>a!=='skip'))return alert('Nessuna operazione selezionata.');
 if(!confirm('Confermi le operazioni? Giacenze, prezzi, lotti e movimenti esistenti rimarranno invariati.'))return;
 let count=0;
 for(let i=0;i<arr.length;i++){
  const x=arr[i],action=actions[i];if(action==='skip')continue;
  const technical={produttore:String(x.produttore||'').slice(0,150),composizione:String(x.composizione||'').slice(0,250),impiego:String(x.impiego||'').slice(0,250),fonte:String(x.fonte||'').slice(0,500),verifica:String(x.verifica||'').slice(0,30)};
  if(action.startsWith('update:')){
   const p=db.prodotti[Number(action.split(':')[1])];if(!p||p.tipo!==x.tipo)continue;
   for(const [k,v] of Object.entries(technical))if(v)p[k]=v;
   if(x.noteTecniche)p.note=[p.note||'',String(x.noteTecniche).slice(0,500)].filter(Boolean).join(' | ');
  }else if(action==='new'){
   db.prodotti.push({id:'pr_'+Date.now()+Math.random(),tipo:x.tipo,nome:String(x.nome).slice(0,150),...technical,dose:'',doseUnita:'',carenza:'',unita:['g','kg','ml','L','pz'].includes(x.unita)?x.unita:'g',giacenza:0,lotto:'',scadenza:'',minimo:0,fornitore:'',costo:0,note:String(x.noteTecniche||'Importato: controllare etichetta e dosi').slice(0,500)});
  }count++;
 }
 window.catalogoDaImportare=null;save();alert('Operazioni eseguite: '+count+'. Dosi non applicate automaticamente.');
}

function salvaPioggiaMisurata(){
 const data=document.getElementById('rainDate')?.value,raw=document.getElementById('rainMm')?.value,mm=Number(raw);
 if(!/^\d{4}-\d{2}-\d{2}$/.test(data||'')||!raw||!Number.isFinite(mm)||mm<0||mm>1000)return alert('Inserisci data e pioggia misurata valida (0–1000 mm).');
 const note=document.getElementById('rainNote')?.value.trim()||'';
 const old=db.pioggeMisurate.find(x=>x.data===data);
 if(old&&!confirm('Esiste già una misurazione per questa data. Sostituirla?'))return;
 db.pioggeMisurate=db.pioggeMisurate.filter(x=>x.data!==data);
 db.pioggeMisurate.push({data,mm,note});save();
}
function eliminaPioggiaMisurata(data){
 if(!confirm('Eliminare la misurazione di pioggia del '+data+'?'))return;
 db.pioggeMisurate=db.pioggeMisurate.filter(x=>x.data!==data);save();
}
function valutazioneIrrigazione(p,today){
 const day=p.prossima||today;
 const measured=db.pioggeMisurate.find(x=>x.data===day);
 const daily=meteoStato.data?.daily;
 const ix=daily?.time?.indexOf(day)??-1;
 const predicted=ix>=0?Number(daily.precipitation_sum?.[ix]):NaN;
 const threshold=Number(db.impostazioniMeteo?.pioggia)||10;
 let info='Nessun dato meteo disponibile per la scadenza: controlla il terreno.';
 if(day<=today&&measured)info='Pioggia misurata: '+Number(measured.mm).toFixed(1)+' mm (prevale sulla previsione). '+(Number(measured.mm)>=threshold?'Valuta se rimandare, verificando umidità e fabbisogno della pianta.':'Verifica umidità e necessità di irrigare.');
 else if(day>today&&Number.isFinite(predicted))info='Pioggia prevista: '+predicted.toFixed(1)+' mm. '+(predicted>=threshold?'Possibile pioggia significativa: ricontrolla prima di irrigare.':'Controlla il terreno prima di irrigare.');
 else if(day===today&&Number.isFinite(predicted))info='Previsione odierna: '+predicted.toFixed(1)+' mm, non ancora misurati. Controlla il terreno.';
 else if(day<today)info='Scadenza passata: verifica il terreno e aggiorna il piano manualmente.';
 return `<div class="notice"><b>${esc(p.coltura)}</b> · scadenza ${esc(day)}<div>${esc(info)}</div></div>`;
}

function eliminaSemina(i){

 // Restituisci esclusivamente uno scarico documentato, non le semine storiche.

 if(x.scaricoEffettuato&&q>0){
  const seed=db.sementi.find(s=>s.id===x.sementeId);
  if(!seed){alert('La semente associata non è più in magazzino. La semina non è stata eliminata: ripristina prima la semente oppure contatta il supporto.');return;}

  if(pacchiSemente(seed)&&Array.isArray(x.dettaglioScarico)){for(const parte of x.dettaglioScarico){const pacco=seed.confezioniDettaglio[parte.indice];if(!pacco)return alert('Confezione originale non trovata: eliminazione annullata.');pacco.residui+=parte.quantita;}aggiornaTotalePacchi(seed);}else if(pacchiSemente(seed)){return alert('Impossibile ripristinare la distribuzione dei semi: eliminazione annullata.');}else seed.quantita=Number((Number(seed.quantita)+q).toFixed(5));

 }

 save();
}

function economia(a){

 const table=cropNames.map(name=>{const c=expenses.filter(x=>x.coltura.toLocaleLowerCase('it')===name.toLocaleLowerCase('it')).reduce((n,x)=>n+Number(x.importo||0),0),k=harvests.filter(x=>x.coltura.toLocaleLowerCase('it')===name.toLocaleLowerCase('it')).reduce((n,x)=>n+Number(x.q||0),0),v=k*(prices[name.toLocaleLowerCase('it')]||0);return {name,c,k,v}});

async function aggiornaMeteo(){

}

function elencoPromemoriaIntelligenti(){
 const out=[];
 const aggiungi=(id,data,tipo,coltura,note,anticipo,origine)=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data||''))return;
  out.push({id,data,tipo,coltura:coltura||'',note:note||'',anticipo,origine});
 };
 db.pianiSemina.forEach(p=>{
  if(p.stato==='Completato')return;
  for(const [campo,tipo,anticipo] of [['semine','🌱 Semina',7],['trapianto','🌿 Trapianto',7],['raccolta','🍅 Raccolta prevista',5]])
   if(p[campo])aggiungi('piano:'+p.id+':'+campo,p[campo],tipo,p.coltura,p.varieta||'',anticipo,'calendarioSemine');
 });
 db.semine.forEach((x,i)=>{
  if(x.stato!=='Programmato'||!x.data)return;
  const tipo=String(x.tipo||'Semina');
  aggiungi('semina:'+String(x.id||i)+':'+x.data,x.data,tipo,x.coltura,x.zona||'',/trapiant/i.test(tipo)?7:7,'semine');
 });
 db.pianiIrrigazione.forEach((x,i)=>{
  if(x.prossima)aggiungi('irrigazione:'+String(x.id||i)+':'+x.prossima,x.prossima,'💧 Controllo irrigazione',x.coltura,x.litri?x.litri+' L indicativi · verificare umidità del terreno':'Verificare umidità del terreno',0,'irrigazioni');
 });
 db.attivita.forEach((x,i)=>{
  const tipo=String(x.tipo||'');if(!x.data||!/^(semina|trapianto|irrigazione|raccolta)$/i.test(tipo.trim()))return;
  aggiungi('attivita:'+String(x.id||i)+':'+x.data,x.data,tipo,x.coltura,x.note||'',/raccolta/i.test(tipo)?5:/irrigazione/i.test(tipo)?0:7,'attivita');
 });
 return out.sort((a,b)=>a.data.localeCompare(b.data));
}

function controlliArchivio(){

 unique(db.colture,x=>[x.nome,x.var,x.data,x.pos].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Colture','colture');
 unique(db.alberi,x=>[x.specie,x.varieta,x.data,x.pos].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Alberi','alberi');
 unique(db.prodotti,x=>[x.nome,x.lotto].map(v=>String(v||'').trim().toLowerCase()).join('|'),'Magazzino','prodotti');
 db.colture.forEach((x,i)=>{if(!String(x.nome||'').trim())add(`Coltura ${i+1}: nome mancante`,'colture')});
 db.alberi.forEach((x,i)=>{if(!String(x.specie||'').trim())add(`Albero ${i+1}: specie mancante`,'alberi')});
 db.prodotti.forEach((x,i)=>{if(!String(x.nome||'').trim())add(`Prodotto ${i+1}: nome mancante`,'prodotti');if(!Number.isFinite(Number(x.giacenza))||Number(x.giacenza)<0)add(`Prodotto ${i+1}: giacenza non valida`,'prodotti')});
 db.mappa.forEach((x,i)=>{if(x.plantId&&!piantaById(x.plantId))add(`Mappa: elemento ${i+1} (${x.nome||'senza nome'}) collegato a una scheda non esistente`,'mappa')});
 db.eventiFrutteto.forEach((x,i)=>{if(x.plantId&&!piantaById(x.plantId))add(`Diario frutteto: evento ${i+1} senza albero associato`,'frutteto')});
 db.irrigazioni.forEach((x,i)=>{if(!Number.isFinite(Number(x.litri))||Number(x.litri)<=0)add(`Irrigazione ${i+1}: litri non validi`,'irrigazioni')});
 db.raccolti.forEach((x,i)=>{if(!Number.isFinite(Number(x.q))||Number(x.q)<0)add(`Raccolto ${i+1}: quantità non valida`,'raccolti')});
 return issues;
}

// Confezioni: inventario per singola busta, con semi residui e stato.
function pacchiSemente(x){return Array.isArray(x.confezioniDettaglio)?x.confezioniDettaglio:null}
function aggiornaTotalePacchi(x){const a=pacchiSemente(x);if(a){x.quantita=a.reduce((n,p)=>n+Number(p.residui||0),0);x.unita='semi';}}
function riepilogoPacchi(x){const a=pacchiSemente(x);if(!a)return '';const attive=a.filter(p=>p.residui>0);return `<div class="muted">📦 ${attive.length} confezioni con semi · 🔓 ${attive.filter(p=>p.aperta).length} aperte · 🔒 ${attive.filter(p=>!p.aperta).length} sigillate</div>`;}
function apriPaccoSemente(id){const x=db.sementi.find(s=>s.id===id),a=x&&pacchiSemente(x);if(!a)return;const i=a.findIndex(p=>!p.aperta&&p.residui>0);if(i<0)return alert('Nessuna confezione sigillata disponibile.');if(!confirm('Aprire una confezione di '+x.coltura+'? I semi resteranno disponibili.'))return;a[i].aperta=true;a[i].apertaIl=localDay(new Date());db.movimentiSementi.push({id:'ms_'+Date.now(),sementeId:id,data:localDay(new Date()),quantita:0,unita:'semi',tipo:'Apertura confezione'});save();}
function consumaPacchi(x,q){const a=pacchiSemente(x);if(!a)return null;let resta=q,parti=[];for(let i=0;i<a.length&&resta>0;i++){const p=a[i];if(!p.aperta||p.residui<=0)continue;const n=Math.min(resta,p.residui);p.residui-=n;resta-=n;parti.push({indice:i,quantita:n});}for(let i=0;i<a.length&&resta>0;i++){const p=a[i];if(p.aperta||p.residui<=0)continue;p.aperta=true;p.apertaIl=localDay(new Date());const n=Math.min(resta,p.residui);p.residui-=n;resta-=n;parti.push({indice:i,quantita:n});}aggiornaTotalePacchi(x);return parti;}
function rettificaPacchi(id){const x=db.sementi.find(s=>s.id===id),a=x&&pacchiSemente(x);if(!a)return;const n=prompt('Quante confezioni NUOVE e sigillate aggiungere?','1');if(n===null)return;const count=Number(n);if(!Number.isInteger(count)||count<1||count>100)return alert('Inserisci da 1 a 100 confezioni.');const per=Number(x.semiPerConfezione);if(!Number.isInteger(per)||per<=0)return alert('Numero di semi per confezione non valido.');for(let i=0;i<count;i++)a.push({residui:per,aperta:false,apertaIl:''});aggiornaTotalePacchi(x);db.movimentiSementi.push({id:'ms_'+Date.now(),sementeId:id,data:localDay(new Date()),quantita:count*per,unita:'semi',tipo:'Acquisto confezioni'});save();}

 const q=Number(x.quantita)||0,min=Number(x.minimo)||0;

 if(x.scadenza&&x.scadenza<=addDays(oggi,60))return 'in-scadenza';
 if(q<=min)return 'scorta-bassa';
 return 'regolare';
}

async function anteprimaImportaSementi(){
 const f=document.getElementById('seedCatalogFile').files[0];if(!f)return alert('Scegli un JSON');
 try{const raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.sementi;
 if(!Array.isArray(arr)||arr.length>1000)throw Error('Formato non valido');
 const valid=arr.filter(x=>x&&typeof x.coltura==='string'&&x.coltura.trim());if(!valid.length)throw Error('Nessuna semente valida');
 window.sementiDaImportare=valid;
 document.getElementById('seedPreview').innerHTML='<h3>Anteprima sementi</h3>'+valid.map((x,i)=>{
  const same=db.sementi.some(p=>p.coltura.trim().toLowerCase()===x.coltura.trim().toLowerCase()&&String(p.varieta||'').trim().toLowerCase()===String(x.varieta||'').trim().toLowerCase());
  return `<p><b>${esc(x.coltura)} ${esc(x.varieta||'')}</b> ${same?'— possibile doppione':''} <label>Operazione<select id="seedAction${i}"><option value="skip">Non importare</option><option value="new">Aggiungi con quantità 0</option></select></label></p>`;
 }).join('')+'<button onclick="confermaImportaSementi()">Conferma sementi selezionate</button>';
 }catch(e){alert('Errore file sementi: '+e.message)}
}

 if(!chosen.length)return alert('Nessuna semente selezionata');
 if(!confirm('Aggiungere '+chosen.length+' sementi con quantità 0, senza modificare le scorte esistenti?'))return;
 for(const x of chosen)db.sementi.push({id:'seed_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),coltura:String(x.coltura).slice(0,120),varieta:String(x.varieta||'').slice(0,120),marca:String(x.marca||'').slice(0,120),lotto:'',quantita:0,unita:'semi',acquisto:'',scadenza:'',germinabilita:'',minimo:0,note:String(x.note||'').slice(0,500)});
 window.sementiDaImportare=null;save();alert('Schede sementi importate: '+chosen.length);
}
function aggiungiSemente(){
 const coltura=smColtura.value.trim(),min=Number(smMinimo.value);
 const usaPacchi=smPacchi.value!==''||smSemiPerPacco.value!=='';
 const np=Number(smPacchi.value),per=Number(smSemiPerPacco.value);
 if(usaPacchi&&(!Number.isInteger(np)||np<1||np>1000||!Number.isInteger(per)||per<1||per>100000||smQuantita.value!==''))return alert('Inserisci numero confezioni e semi per confezione, lasciando vuota Quantità.');
 const q=usaPacchi?np*per:Number(smQuantita.value);
 if(!coltura||(!usaPacchi&&smQuantita.value==='')||!Number.isFinite(q)||q<0||!Number.isFinite(min)||min<0)return alert('Inserisci ortaggio e quantità valide.');
 if(smGerminabilita.value!==''&&(Number(smGerminabilita.value)<0||Number(smGerminabilita.value)>100))return alert('Germinabilità tra 0 e 100.');
 db.sementi.push({id:'seed_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),coltura,varieta:smVarieta.value.trim(),marca:smMarca.value.trim(),lotto:smLotto.value.trim(),quantita:q,unita:usaPacchi?'semi':smUnita.value,...(usaPacchi?{semiPerConfezione:per,confezioniDettaglio:Array.from({length:np},()=>({residui:per,aperta:false,apertaIl:''}))}:{}),acquisto:smAcquisto.value,scadenza:smScadenza.value,germinabilita:smGerminabilita.value,minimo:min,note:smNote.value.trim()});save();
}
function rettificaSemente(id){
 const x=db.sementi.find(x=>x.id===id);if(!x)return;
 if(pacchiSemente(x))return rettificaPacchi(id);
 const raw=prompt('Variazione di scorta per '+x.coltura+' ('+x.unita+'). Esempio: +10 o -2','0');if(raw===null)return;
 if(!/^[+-]?\d+(?:[.,]\d+)?$/.test(raw.trim()))return alert('Inserisci un numero valido.');
 const n=Number(raw.replace(',','.'));if(!Number.isFinite(n)||Number(x.quantita)+n<0)return alert('Scorta insufficiente.');
 if(!n)return;x.quantita=Number((Number(x.quantita)+n).toFixed(5));
 db.movimentiSementi.push({id:'ms_'+Date.now(),sementeId:id,data:localDay(new Date()),quantita:n,unita:x.unita,tipo:'Rettifica manuale'});save();
}

// Modifica sicura delle schede sementi: le giacenze si cambiano soltanto con ± Scorta.
function modificaSemente(id){
 const x=db.sementi.find(s=>s.id===id);if(!x)return alert('Semente non trovata.');
 const campi=[['coltura','Ortaggio'],['varieta','Varietà'],['marca','Marca / produttore'],['lotto','Lotto'],['acquisto','Data acquisto (AAAA-MM-GG)'],['scadenza','Scadenza (AAAA-MM-GG)'],['germinabilita','Germinabilità %'],['minimo','Scorta minima'],['note','Note']];
 const valori={};
 for(const [k,label] of campi){
  const v=prompt(label,String(x[k]??''));if(v===null)return;
  valori[k]=v.trim();
 }
 if(!valori.coltura)return alert('Inserisci il nome dell’ortaggio.');
 for(const k of ['acquisto','scadenza'])if(valori[k]&&!/^\d{4}-\d{2}-\d{2}$/.test(valori[k]))return alert('Formato data non valido. Nessuna modifica salvata.');
 if(valori.germinabilita!==''&&(!Number.isFinite(Number(valori.germinabilita))||Number(valori.germinabilita)<0||Number(valori.germinabilita)>100))return alert('Germinabilità non valida.');
 if(valori.minimo===''||!Number.isFinite(Number(valori.minimo))||Number(valori.minimo)<0)return alert('Scorta minima non valida.');
 Object.assign(x,valori,{minimo:Number(valori.minimo)});save();
}
// V8.1 - Consigli di semina: sola lettura, nessuna modifica alle scorte.
function classeGerminabilita(p){
 if(p===null||!Number.isFinite(p))return 'Non disponibile';
 return p>=80?'🟢 Alta':p>=60?'🟠 Media':'🔴 Bassa';
}
function ultimoRisultatoGerminazione(sementeId){
 const prove=(db.proveGerminazione||[]).filter(x=>x.sementeId===sementeId&&Number(x.seminati)>0&&Number(x.germogliati)>=0&&Number(x.germogliati)<=Number(x.seminati));
 prove.sort((a,b)=>String(b.rilevazione||b.data||'').localeCompare(String(a.rilevazione||a.data||''))||String(b.data||'').localeCompare(String(a.data||'')));
 if(!prove.length)return null;
 return 100*Number(prove[0].germogliati)/Number(prove[0].seminati);
}
function aggiornaCalcolatoreSemina(){
 const scelta=document.getElementById('calcSemente'),quantita=document.getElementById('calcPiantine'),output=document.getElementById('calcRisultato');
 if(!scelta||!quantita||!output)return;
 const seme=(db.sementi||[]).find(x=>x.id===scelta.value);
 if(!seme){output.textContent='Seleziona una semente per iniziare.';return;}
 let p=ultimoRisultatoGerminazione(seme.id),fonte='ultima prova registrata';
 if(p===null){
  const raw=seme.germinabilita;
  p=raw===''||raw===null||raw===undefined?null:Number(raw);
  if(p!==null&&(!Number.isFinite(p)||p<0||p>100))p=null;
  fonte='germinabilità indicata nella scheda';
 }
 if(p===null){output.textContent='Germinabilità non disponibile: registra una prova o compila la percentuale nella scheda della semente.';return;}
 const n=Number(quantita.value);
 if(!Number.isSafeInteger(n)||n<1||n>1000000){output.textContent='Inserisci un numero intero di piantine tra 1 e 1.000.000.';return;}
 if(p===0){output.textContent='Germinabilità 0% — 🔴 Bassa. Impossibile stimare i semi necessari: esegui una nuova prova.';return;}
 const semi=Math.ceil(n/(p/100));
 output.textContent='Germinabilità '+Number(p.toFixed(1))+'% ('+fonte+') — '+classeGerminabilita(p)+'. Per circa '+n+' piantine: semina '+semi+' semi. È una stima, non una garanzia.';
}

function validaProvaGerminazione(seminati,germogliati,data,rilevazione){
 if(!Number.isSafeInteger(seminati)||seminati<1||!Number.isSafeInteger(germogliati)||germogliati<0||germogliati>seminati)return 'Inserisci numeri interi validi: i germogliati non possono superare i seminati.';
 if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||!/^\d{4}-\d{2}-\d{2}$/.test(rilevazione)||Number.isNaN(Date.parse(data))||Number.isNaN(Date.parse(rilevazione))||rilevazione<data)return 'Controlla le date: la rilevazione non può precedere la semina.';
 return '';
}
function salvaProvaGerminazione(){
 const seme=db.sementi.find(x=>x.id===document.getElementById('germSemente').value);

   }

   const label=String(message||'');
   const isDate=/\b(data|scadenza|rilevazione|trapianto|semina|raccolta|prossimo controllo|sostituzione attrattivo)\b/i.test(label)
      && (/AAAA-MM-GG|GG-MM-AAAA/i.test(label)||iso.test(String(defaultValue||''))||/^(data|scadenza|rilevazione|prossimo controllo|sostituzione attrattivo)/i.test(label));
   if(!isDate)return nativePrompt(message,defaultValue);
   const result=nativePrompt(label.replaceAll('AAAA-MM-GG','GG-MM-AAAA'),toIT(defaultValue||''));
   if(result===null)return null;
   const converted=toISO(result);
   if(converted===null){alert('Data non valida. Inserisci GG-MM-AAAA, ad esempio 30-11-2026.');return null}
   return converted;
 };
})();
</script>
